<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fondo mensual</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; }
#raiz { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
.tarjeta { position: absolute; box-sizing: border-box; border-radius: 36px; box-shadow: 0 6px 18px rgba(60, 40, 50, 0.10); }
.celda { width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; border-radius: 50%; box-sizing: border-box; }
.script { font-family: 'Caveat', cursive; line-height: 1; }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
// Los datos los inyecta generar.mjs (window.__DATOS__): año, mes, tema, feriados, cumpleaños e imágenes.
const D = window.__DATOS__;
const T = D.tema;

const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const LETRAS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

// ---------- Formas decorativas (centradas en 0,0, radio r) ----------
const FORMAS = {
  flor: (r, c) => {
    const p = [0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="${-r * 0.5}" rx="${r * 0.36}" ry="${r * 0.55}" transform="rotate(${a})"/>`).join('');
    return `<g fill="${c}" stroke="rgba(0,0,0,.10)" stroke-width="1">${p}</g><circle r="${r * 0.17}" fill="#F4C95D"/>`;
  },
  corazon: (r, c) => `<path d="M0 ${r * 0.9} C ${-r * 1.3} ${-r * 0.1} ${-r * 0.5} ${-r} 0 ${-r * 0.35} C ${r * 0.5} ${-r} ${r * 1.3} ${-r * 0.1} 0 ${r * 0.9} Z" fill="${c}"/>`,
  hoja: (r, c) => `<path d="M0 ${-r} C ${r * 0.9} ${-r * 0.4} ${r * 0.9} ${r * 0.5} 0 ${r} C ${-r * 0.9} ${r * 0.5} ${-r * 0.9} ${-r * 0.4} 0 ${-r} Z" fill="${c}"/><path d="M0 ${-r * 0.85} L0 ${r * 0.85}" stroke="rgba(0,0,0,.15)" stroke-width="2" fill="none"/>`,
  copo: (r, c) => {
    let s = '';
    for (let i = 0; i < 6; i++) {
      s += `<g transform="rotate(${i * 60})"><line x1="0" y1="0" x2="0" y2="${-r}"/><line x1="0" y1="${-r * 0.55}" x2="${r * 0.25}" y2="${-r * 0.8}"/><line x1="0" y1="${-r * 0.55}" x2="${-r * 0.25}" y2="${-r * 0.8}"/></g>`;
    }
    return `<g stroke="${c}" stroke-width="${Math.max(2, r * 0.09)}" stroke-linecap="round" fill="none">${s}</g>`;
  },
  estrella: (r, c) => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? r * 0.45 : r;
      pts.push(`${(Math.cos(a) * rr).toFixed(1)},${(Math.sin(a) * rr).toFixed(1)}`);
    }
    return `<polygon points="${pts.join(' ')}" fill="${c}"/>`;
  },
  brillo: (r, c) => `<path d="M0 ${-r} Q ${r * 0.12} ${-r * 0.12} ${r} 0 Q ${r * 0.12} ${r * 0.12} 0 ${r} Q ${-r * 0.12} ${r * 0.12} ${-r} 0 Q ${-r * 0.12} ${-r * 0.12} 0 ${-r} Z" fill="${c}"/>`,
  sol: (r, c) => {
    let s = '';
    for (let i = 0; i < 12; i++) s += `<line x1="0" y1="${-r * 0.72}" x2="0" y2="${-r}" transform="rotate(${i * 30})"/>`;
    return `<circle r="${r * 0.5}" fill="${c}"/><g stroke="${c}" stroke-width="${Math.max(2, r * 0.09)}" stroke-linecap="round">${s}</g>`;
  },
  gota: (r, c) => `<path d="M0 ${-r} C ${r * 0.9} ${r * 0.1} ${r * 0.7} ${r} 0 ${r} C ${-r * 0.7} ${r} ${-r * 0.9} ${r * 0.1} 0 ${-r} Z" fill="${c}"/>`,
  rombo: (r, c) => `<polygon points="0,${-r} ${r * 0.65},0 0,${r} ${-r * 0.65},0" fill="${c}"/><g stroke="rgba(255,255,255,.7)" stroke-width="2"><line x1="0" y1="${-r}" x2="0" y2="${r}"/><line x1="${-r * 0.65}" y1="0" x2="${r * 0.65}" y2="0"/></g><path d="M0 ${r} q ${r * 0.3} ${r * 0.35} 0 ${r * 0.7} t 0 ${r * 0.7}" fill="none" stroke="${c}" stroke-width="3"/>`,
  globo: (r, c) => `<ellipse cx="0" cy="${-r * 0.15}" rx="${r * 0.6}" ry="${r * 0.75}" fill="${c}"/><ellipse cx="${-r * 0.2}" cy="${-r * 0.4}" rx="${r * 0.13}" ry="${r * 0.22}" fill="rgba(255,255,255,.4)"/><path d="M0 ${r * 0.6} l ${-r * 0.1} ${r * 0.15} h ${r * 0.2} Z" fill="${c}"/><path d="M0 ${r * 0.75} q ${r * 0.2} ${r * 0.15} 0 ${r * 0.3} t 0 ${r * 0.3}" stroke="rgba(0,0,0,.25)" fill="none" stroke-width="2"/>`,
  adorno: (r, c) => `<rect x="${-r * 0.15}" y="${-r * 0.78}" width="${r * 0.3}" height="${r * 0.22}" rx="2" fill="#E7B64A"/><circle cx="0" cy="${-r * 0.88}" r="${r * 0.1}" fill="none" stroke="#E7B64A" stroke-width="2"/><circle cx="0" cy="${r * 0.12}" r="${r * 0.68}" fill="${c}"/><path d="M${-r * 0.4} ${-r * 0.05} A ${r * 0.5} ${r * 0.5} 0 0 1 ${-r * 0.05} ${-r * 0.4}" stroke="rgba(255,255,255,.55)" stroke-width="${r * 0.09}" fill="none" stroke-linecap="round"/>`,
  limon: (r, c) => `<g fill="${c}" stroke="rgba(120,70,0,.22)" stroke-width="1.5"><ellipse cx="0" cy="0" rx="${r * 0.86}" ry="${r * 0.95}"/><path d="M${-r * 0.2} ${r * 0.88} Q 0 ${r * 1.22} ${r * 0.2} ${r * 0.88} Z"/><path d="M${-r * 0.16} ${-r * 0.88} Q 0 ${-r * 1.1} ${r * 0.16} ${-r * 0.88} Z"/></g><ellipse cx="${-r * 0.4}" cy="${-r * 0.3}" rx="${r * 0.16}" ry="${r * 0.34}" fill="rgba(255,255,255,.38)" transform="rotate(20 ${-r * 0.4} ${-r * 0.3})"/>`,
  paraguas: (r, c) => `<g transform="translate(0 ${-r * 0.3})"><path d="M${-r} 0 A ${r} ${r} 0 0 1 ${r} 0 Q ${r * 0.5} ${-r * 0.18} 0 0 Q ${-r * 0.5} ${-r * 0.18} ${-r} 0 Z" fill="${c}"/><path d="M0 0 V ${r * 0.95} q 0 ${r * 0.3} ${-r * 0.28} ${r * 0.22}" fill="none" stroke="${c}" stroke-width="${Math.max(2.5, r * 0.1)}" stroke-linecap="round"/></g>`,
  huella: (r, c) => `<g fill="${c}"><ellipse cx="0" cy="${r * 0.28}" rx="${r * 0.46}" ry="${r * 0.38}"/><circle cx="${-r * 0.58}" cy="${-r * 0.18}" r="${r * 0.2}"/><circle cx="${-r * 0.22}" cy="${-r * 0.52}" r="${r * 0.21}"/><circle cx="${r * 0.22}" cy="${-r * 0.52}" r="${r * 0.21}"/><circle cx="${r * 0.58}" cy="${-r * 0.18}" r="${r * 0.2}"/></g>`,
  sobre: (r, c) => `<rect x="${-r * 0.9}" y="${-r * 0.62}" width="${r * 1.8}" height="${r * 1.24}" rx="${r * 0.1}" fill="${c}"/><path d="M${-r * 0.88} ${-r * 0.55} L0 ${r * 0.15} L${r * 0.88} ${-r * 0.55}" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="${Math.max(2, r * 0.08)}" stroke-linejoin="round"/>`,
  circulo: (r, c) => `<circle r="${r * 0.35}" fill="${c}"/>`,
  ola: (r, c) => `<path d="M${-r} 0 q ${r * 0.25} ${-r * 0.4} ${r * 0.5} 0 t ${r * 0.5} 0 t ${r * 0.5} 0 t ${r * 0.5} 0" fill="none" stroke="${c}" stroke-width="${Math.max(3, r * 0.12)}" stroke-linecap="round"/>`
};

// Qué formas usa cada motivo de los temas
const MOTIVOS = {
  verano: ['sol', 'brillo', 'ola', 'flor'],
  amor: ['corazon', 'sobre', 'brillo', 'corazon', 'sobre'],
  otonio: ['hoja', 'hoja', 'gota', 'circulo'],
  madres: ['flor', 'flor', 'hoja', 'brillo'],
  invierno: ['copo', 'copo', 'brillo', 'gota'],
  cumple: ['globo', 'estrella', 'circulo', 'brillo'],
  lluvia: ['gota', 'paraguas', 'huella', 'hoja', 'gota', 'huella'],
  costa: ['limon', 'hoja', 'limon', 'ola', 'brillo'],
  patrio: ['rombo', 'estrella', 'circulo'],
  primavera: ['flor', 'flor', 'hoja', 'brillo'],
  lila: ['flor', 'hoja', 'brillo', 'circulo'],
  navidad: ['adorno', 'estrella', 'copo', 'hoja']
};

// Números pseudoaleatorios repetibles: el mismo mes siempre se ve igual
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Reparte las formas del tema sin que se encimen
function formasSueltas(w, h, seed, n, rMin, rMax) {
  const R = rng(seed);
  const tipos = MOTIVOS[T.motivo] || MOTIVOS.primavera;
  const puestas = [];
  let out = '';
  for (let i = 0; i < n * 40 && puestas.length < n; i++) {
    const r = rMin + R() * (rMax - rMin);
    const x = r + R() * (w - 2 * r);
    const y = r + R() * (h - 2 * r);
    if (puestas.some(p => Math.hypot(p.x - x, p.y - y) < (p.r + r) * 1.05)) continue;
    puestas.push({ x, y, r });
    const tipo = tipos[puestas.length % tipos.length];
    let color = T.formas[Math.floor(R() * T.formas.length)];
    // Las hojas son verdes, salvo en los meses de otoño
    if (tipo === 'hoja' && T.motivo !== 'otonio') color = T.hoja || '#8FAA80';
    // Los limones son siempre amarillos
    if (tipo === 'limon') color = T.formas[Math.floor(R() * 2)];
    const giro = Math.round(R() * 360);
    out += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${giro})" opacity="0.93">${FORMAS[tipo](r, color)}</g>`;
  }
  return out;
}

function escena(w, h, seed) {
  const n = Math.round(w * h / 9500);
  const [c0, c1, c2] = T.cielo;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;left:0;top:0;display:block">
    <defs><linearGradient id="cielo${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c0}"/><stop offset="0.6" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#cielo${seed})"/>${formasSueltas(w, h, seed, n, 18, 54)}</svg>`;
}

// ---------- Piezas compartidas por las escenas de ventana ----------
function fondoVentana(w, h, seed) {
  const R = rng(seed * 13 + 5);
  let luces = '', gotas = '';
  for (let i = 0; i < 26; i++) {
    const x = R() * w, y = R() * h * 0.85, r = 10 + R() * 28;
    luces += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(0)}" fill="url(#bok${seed}${i % 2})" opacity="${(0.35 + R() * 0.5).toFixed(2)}"/>`;
  }
  const n = Math.round(w * h / 1300);
  for (let i = 0; i < n; i++) {
    const x = R() * w, y = R() * h, rx = 2 + R() * 4, ry = rx * (1.2 + R() * 0.6);
    gotas += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}"/>`;
  }
  return `<defs>
      <linearGradient id="vent${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B221F"/><stop offset="1" stop-color="#5C3A26"/></linearGradient>
      <radialGradient id="bok${seed}0"><stop offset="0.55" stop-color="#FFC266" stop-opacity="0.6"/><stop offset="1" stop-color="#FFB24D" stop-opacity="0.12"/></radialGradient>
      <radialGradient id="bok${seed}1"><stop offset="0.55" stop-color="#FFE29A" stop-opacity="0.6"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0.12"/></radialGradient>
      <radialGradient id="brasa"><stop offset="0" stop-color="#FFC866" stop-opacity="0.55"/><stop offset="1" stop-color="#FFC866" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="${w}" height="${h}" fill="url(#vent${seed})"/>
    ${luces}
    <g fill="rgba(255,255,255,.14)" stroke="rgba(255,236,200,.5)" stroke-width="1">${gotas}</g>`;
}

function vela(x, y, s) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <circle cx="0" cy="-92" r="110" fill="url(#brasa)"/>
    <rect x="-42" y="-100" width="84" height="100" rx="8" fill="rgba(255,226,170,.30)" stroke="rgba(255,226,170,.65)" stroke-width="2"/>
    <g stroke="rgba(255,226,170,.35)" stroke-width="2">${[-28, -14, 0, 14, 28].map(v => `<line x1="${v}" y1="-94" x2="${v}" y2="-6"/>`).join('')}</g>
    <rect x="-34" y="-70" width="68" height="64" rx="6" fill="#F6E3BE"/>
    <line x1="0" y1="-70" x2="0" y2="-80" stroke="#3A2A20" stroke-width="3"/>
    <path d="M0 -112 C 9 -98 9 -84 0 -80 C -9 -84 -9 -98 0 -112 Z" fill="#FFD66B"/>
    <path d="M0 -102 C 4 -95 4 -88 0 -86 C -4 -88 -4 -95 0 -102 Z" fill="#FFF3C4"/>
  </g>`;
}

function arce(x, y, r, rot, c) {
  const mitad = [[0, -1], [0.17, -0.6], [0.55, -0.85], [0.48, -0.4], [0.95, -0.35], [0.62, -0.05], [0.82, 0.28], [0.3, 0.28], [0.28, 0.62], [0, 0.5]];
  const der = mitad.map(p => [p[0] * r, p[1] * r]);
  const izq = mitad.slice(1, -1).reverse().map(p => [-p[0] * r, p[1] * r]);
  const pts = [...der, ...izq].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<g transform="translate(${x} ${y}) rotate(${rot})">
    <polygon points="${pts}" fill="rgba(0,0,0,.3)" transform="translate(3 4)" stroke-linejoin="round"/>
    <line x1="0" y1="${r * 0.5}" x2="0" y2="${r * 1.05}" stroke="#6A4B2E" stroke-width="${Math.max(2, r * 0.06)}" stroke-linecap="round"/>
    <polygon points="${pts}" fill="${c}" stroke-linejoin="round"/>
    <path d="M0 ${r * 0.5} L0 ${-r * 0.95} M0 ${r * 0.3} L${r * 0.8} ${-r * 0.3} M0 ${r * 0.3} L${-r * 0.8} ${-r * 0.3} M0 ${-r * 0.2} L${r * 0.5} ${-r * 0.75} M0 ${-r * 0.2} L${-r * 0.5} ${-r * 0.75}" stroke="rgba(255,226,160,.55)" stroke-width="${Math.max(1.5, r * 0.035)}" fill="none" stroke-linecap="round"/>
  </g>`;
}

// ---------- Pino nevado (base en 0,0; crece hacia arriba) ----------
function pino(x, y, s, verde, nieve) {
  let capas = '';
  for (let i = 0; i < 4; i++) {
    const base = -12 - i * 46, top = base - 62, ancho = 74 - i * 14, alto = base - top;
    capas += `<polygon points="${-ancho},${base} 0,${top} ${ancho},${base}" fill="${verde}"/>`;
    capas += `<path d="M0 ${top} L${ancho * 0.58} ${top + alto * 0.58} Q${ancho * 0.3} ${top + alto * 0.46} 0 ${top + alto * 0.58} Q${-ancho * 0.3} ${top + alto * 0.46} ${-ancho * 0.58} ${top + alto * 0.58} Z" fill="${nieve}"/>`;
    capas += `<ellipse cx="${-ancho * 0.9}" cy="${base - 2}" rx="${ancho * 0.22}" ry="5" fill="${nieve}"/><ellipse cx="${ancho * 0.9}" cy="${base - 2}" rx="${ancho * 0.22}" ry="5" fill="${nieve}"/>`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="-14" width="12" height="24" fill="#5A4636"/>${capas}</g>`;
}

// ---------- Fiestas Patrias: bandera, copihue, nubes ----------
function estrellaCl(cx, cy, r, c) {
  let p = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.4 : r; p += `${(cx + Math.cos(a) * rr).toFixed(1)},${(cy + Math.sin(a) * rr).toFixed(1)} `; }
  return `<polygon points="${p}" fill="${c}"/>`;
}
function banderaCl(w, h) {
  return `<rect width="${w}" height="${h}" fill="#FFFFFF"/><rect y="${h / 2}" width="${w}" height="${h / 2}" fill="#D52B1E"/><rect width="${h / 2}" height="${h / 2}" fill="#1F4FA3"/>${estrellaCl(h / 4, h / 4, h / 6.5, '#FFFFFF')}<rect width="${w}" height="${h}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="0.8"/>`;
}
function hojaCl(x, y, s, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 0 C 26 -10 40 14 30 44 C 16 52 -6 30 0 0 Z" fill="#4C7B3A"/><path d="M2 4 C 14 18 24 30 28 42" stroke="#2F5A28" stroke-width="2" fill="none"/></g>`;
}
function copihueCl(x, y, s, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
    <path d="M-7 0 L7 0 L24 62 Q0 78 -24 62 Z" fill="#D8284A"/>
    <path d="M-2 0 L-8 66 M3 0 L10 68" stroke="#A81C38" stroke-width="2.2" fill="none" opacity=".8"/>
    <path d="M-9 4 L-17 60" stroke="#F0587A" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="-14" cy="66" rx="12" ry="8" fill="#E23557"/><ellipse cx="0" cy="70" rx="12" ry="8" fill="#E8486A"/><ellipse cx="14" cy="66" rx="12" ry="8" fill="#DB2D4F"/>
    <rect x="-3.5" y="-8" width="7" height="10" rx="2" fill="#5E8A3C"/>
  </g>`;
}
function nubeCl(x, y, s, op) {
  return `<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity="${op}"><circle cx="0" cy="0" r="20"/><circle cx="24" cy="-8" r="26"/><circle cx="52" cy="2" r="20"/><circle cx="26" cy="10" r="20"/></g>`;
}

// ---------- Cerezos en flor ----------
function florCerezo(x, y, r, rot, c) {
  let p = '';
  for (let i = 0; i < 5; i++) p += `<ellipse cx="0" cy="${-r * 0.62}" rx="${r * 0.46}" ry="${r * 0.62}" fill="${c}" transform="rotate(${i * 72})"/>`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})">${p}<circle r="${r * 0.2}" fill="#F4C95D"/><circle r="${r * 0.09}" fill="#C9772F"/></g>`;
}
function petaloCerezo(x, y, s, rot, c) {
  return `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${s})" d="M0 0 C 6 -6 12 -2 10 6 C 8 10 2 10 0 4 C -1 2 -1 1 0 0 Z" fill="${c}"/>`;
}

// ---------- Hortensias ----------
const PAL_ROSA = ['#F2A6C4', '#E985AE', '#F8C6DA', '#C95A8C'];
const PAL_AZUL = ['#9DB9EA', '#7C9BDC', '#BDD1F3', '#5F79BE'];
const PAL_LILA = ['#B89BD8', '#9C80C9', '#CDB9E8', '#7A5FA8'];
function floritoHo(x, y, f, rot, c) {
  let p = '';
  for (let i = 0; i < 4; i++) p += `<ellipse cx="0" cy="${-f * 0.36}" rx="${f * 0.4}" ry="${f * 0.5}" fill="${c}" stroke="rgba(120,60,100,.18)" stroke-width="${Math.max(0.4, f * 0.03).toFixed(2)}" transform="rotate(${i * 90})"/>`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})">${p}<circle r="${(f * 0.1).toFixed(2)}" fill="#DCD6EA"/></g>`;
}
function hortensiaCl(cx, cy, r, seed, pal) {
  const R = rng(seed);
  const n = Math.round(18 + r * 0.55), pts = [];
  for (let i = 0; i < n; i++) { const a = R() * Math.PI * 2, d = Math.sqrt(R()) * 0.86; pts.push([cx + Math.cos(a) * d * r, cy + Math.sin(a) * d * r * 0.9]); }
  pts.sort((a, b) => a[1] - b[1]);
  const f = r * 0.34;
  let out = `<ellipse cx="${cx}" cy="${cy}" rx="${r * 0.96}" ry="${r * 0.88}" fill="${pal[3]}" opacity=".85"/>`;
  pts.forEach((p) => { out += floritoHo(p[0], p[1], f * (0.8 + R() * 0.4), R() * 90, pal[Math.floor(R() * 3)]); });
  return out;
}
function hojaHo(x, y, s, rot, c) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 0 C 40 -52 112 -44 132 0 C 112 44 40 52 0 0 Z" fill="${c || '#3F6B3A'}"/><path d="M0 0 L128 0 M30 0 L56 -26 M30 0 L56 26 M66 0 L92 -22 M66 0 L92 22" stroke="rgba(255,255,255,.28)" stroke-width="2.4" fill="none"/></g>`;
}

// ---------- Navidad: pascua, chispas ----------
function pascuaCl(x, y, r, rot) {
  let ext = '', inn = '';
  for (let k = 0; k < 8; k++) ext += `<path transform="rotate(${k * 45 + rot}) scale(${r / 52})" d="M0 0 C 14 -14 16 -36 0 -56 C -16 -36 -14 -14 0 0Z" fill="#A8102A"/>`;
  for (let k = 0; k < 8; k++) inn += `<path transform="rotate(${k * 45 + 22.5 + rot}) scale(${r / 52 * 0.8})" d="M0 0 C 14 -14 16 -36 0 -56 C -16 -36 -14 -14 0 0Z" fill="#D72440"/><path transform="rotate(${k * 45 + 22.5 + rot}) scale(${r / 52 * 0.8})" d="M0 -4 L0 -46" stroke="#9A0F26" stroke-width="2" opacity=".7"/>`;
  let c = '';
  for (let k = 0; k < 6; k++) c += `<circle cx="${(Math.cos(k * 1.05) * r * 0.1).toFixed(1)}" cy="${(Math.sin(k * 1.05) * r * 0.1).toFixed(1)}" r="${(r * 0.05).toFixed(1)}" fill="#E3C54A"/>`;
  return `<g transform="translate(${x} ${y}) scale(1 0.82)">${ext}${inn}<circle r="${(r * 0.15).toFixed(1)}" fill="#8A7A22"/>${c}</g>`;
}
function chispaCl(x, y, r, seed, idGlow) {
  const R = rng(seed);
  let l = '', p = '';
  for (let i = 0; i < 46; i++) {
    const a = R() * Math.PI * 2, len = r * (0.35 + R() * 0.65);
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    l += `<line x1="${(x + Math.cos(a) * r * 0.08).toFixed(1)}" y1="${(y + Math.sin(a) * r * 0.08).toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${R() < 0.35 ? '#FFFFFF' : '#FFD98A'}" stroke-width="${(0.8 + R() * 1.1).toFixed(1)}" stroke-linecap="round" opacity="${(0.6 + R() * 0.4).toFixed(2)}"/>`;
    if (R() < 0.5) p += `<circle cx="${(x2 + Math.cos(a) * 4).toFixed(1)}" cy="${(y2 + Math.sin(a) * 4).toFixed(1)}" r="${(0.9 + R() * 1.3).toFixed(1)}" fill="#FFE9B0"/>`;
  }
  return `<circle cx="${x}" cy="${y}" r="${r * 0.9}" fill="url(#${idGlow})"/>${l}${p}<circle cx="${x}" cy="${y}" r="${r * 0.1}" fill="#FFFFFF"/>`;
}

function tulipan(x, y, s, c, h) {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M0 0 C -2 ${-h * 0.4} 2 ${-h * 0.7} 0 ${-h}" stroke="#6E9150" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 ${-h * 0.12} C -38 ${-h * 0.3} -34 ${-h * 0.62} -24 ${-h * 0.7} C -14 ${-h * 0.5} -4 ${-h * 0.35} 0 ${-h * 0.12} Z" fill="#7FA562"/>
    <g transform="translate(0 ${-h})">
      <path d="M-17 0 C -19 -26 -9 -40 0 -48 C 9 -40 19 -26 17 0 C 9 8 -9 8 -17 0 Z" fill="${c}"/>
      <path d="M0 -48 C -7 -30 -7 -12 0 6 C 7 -12 7 -30 0 -48 Z" fill="rgba(255,255,255,.38)"/>
    </g>
  </g>`;
}

function ramita(x, y, rot, largo, c1, c2) {
  let s = `<path d="M0 0 C ${largo * 0.08} ${-largo * 0.5} ${-largo * 0.08} ${-largo * 0.8} 0 ${-largo}" stroke="#6E8F5A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  for (let i = 1; i <= 6; i++) {
    const yy = -largo * i / 7, lado = i % 2 ? 1 : -1;
    const fx = lado * (12 + i * 2), fy = yy - 12;
    s += `<path d="M0 ${yy} L${fx} ${fy}" stroke="#6E8F5A" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    s += `<circle cx="${fx}" cy="${fy}" r="6" fill="${i % 2 ? c1 : c2}"/><circle cx="${fx}" cy="${fy}" r="1.8" fill="#8C3B5C"/>`;
  }
  s += `<circle cx="0" cy="${-largo}" r="6.5" fill="${c1}"/><circle cx="0" cy="${-largo}" r="2" fill="#8C3B5C"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot})">${s}</g>`;
}

function espiga(x, y, rot, largo) {
  let s = `<path d="M0 0 C ${largo * 0.05} ${-largo * 0.5} ${-largo * 0.05} ${-largo * 0.8} 0 ${-largo}" stroke="#7A9B62" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  for (let i = 0; i < 9; i++) {
    const yy = -largo * (0.4 + i * 0.065), lado = i % 2 ? 1 : -1;
    const fx = lado * (9 + (8 - i) * 0.9), r = 7 - i * 0.35;
    s += `<circle cx="${fx}" cy="${yy}" r="${r.toFixed(1)}" fill="#E4EBF6" stroke="#B7C4E0" stroke-width="1.5"/><circle cx="${fx}" cy="${yy}" r="${(r * 0.35).toFixed(1)}" fill="#9A8FC8"/>`;
  }
  return `<g transform="translate(${x} ${y}) rotate(${rot})">${s}</g>`;
}

  hojas: (w, h, seed) => {
    const FORMA = {
      maple: { mitad: [[0, -1], [0.17, -0.6], [0.55, -0.85], [0.48, -0.4], [0.95, -0.35], [0.62, -0.05], [0.82, 0.28], [0.3, 0.28], [0.28, 0.62], [0, 0.5]], puntas: [[0.55, -0.85], [0.95, -0.35], [0.82, 0.28]], tallo: 0.5 },
      roble: { mitad: [[0, -1], [0.3, -0.86], [0.22, -0.62], [0.52, -0.5], [0.36, -0.28], [0.64, -0.1], [0.4, 0.1], [0.56, 0.32], [0.28, 0.4], [0.3, 0.64], [0.1, 0.72], [0, 0.9]], puntas: [[0.52, -0.5], [0.64, -0.1], [0.56, 0.32]], tallo: 0.85 }
    };
    const par = (p, r) => p[0].toFixed(1) + ',' + p[1].toFixed(1);
    const hoja = (tipo, r, c, rot, x, y) => {
      let forma, venas, tallo;
      if (tipo === 'oval') {
        forma = `<path d="M0 ${-r} C ${r * 0.75} ${-r * 0.45} ${r * 0.75} ${r * 0.5} 0 ${r * 1.05} C ${-r * 0.75} ${r * 0.5} ${-r * 0.75} ${-r * 0.45} 0 ${-r} Z"/>`;
        venas = `M0 ${-r * 0.9} L0 ${r} M0 ${-r * 0.2} L${r * 0.42} ${-r * 0.55} M0 ${-r * 0.2} L${-r * 0.42} ${-r * 0.55} M0 ${r * 0.3} L${r * 0.45} ${-r * 0.02} M0 ${r * 0.3} L${-r * 0.45} ${-r * 0.02}`;
        tallo = r * 1.0;
      } else {
        const f = FORMA[tipo];
        const der = f.mitad.map(p => [p[0] * r, p[1] * r]);
        const izq = f.mitad.slice(1, -1).reverse().map(p => [-p[0] * r, p[1] * r]);
        forma = `<polygon points="${[...der, ...izq].map(p => par(p)).join(' ')}" stroke-linejoin="round"/>`;
        venas = `M0 ${f.tallo * r * 0.9} L0 ${-r * 0.95}`;
        f.puntas.forEach(p => {
          venas += ` M0 ${(p[1] * 0.5 + 0.2) * r} L${p[0] * r * 0.88} ${p[1] * r * 0.88} M0 ${(p[1] * 0.5 + 0.2) * r} L${-p[0] * r * 0.88} ${p[1] * r * 0.88}`;
        });
        tallo = f.tallo * r;
      }
      return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})">
        <g fill="rgba(0,0,0,.28)" transform="translate(4 5)">${forma}</g>
        <line x1="0" y1="${tallo}" x2="0" y2="${tallo + r * 0.5}" stroke="#6A4B2E" stroke-width="${Math.max(2, r * 0.05)}" stroke-linecap="round"/>
        <g fill="${c}">${forma}</g>
        <path d="${venas}" stroke="rgba(255,236,170,.6)" stroke-width="${Math.max(1.5, r * 0.035)}" fill="none" stroke-linecap="round"/>
      </g>`;
    };
    const R = rng(seed * 7 + 3);
    const verdes = ['#5C8038', '#2F4A22', '#7A9B4A', '#456B2B'];
    let pasto = '';
    for (let i = 0; i < w * h / 170; i++) {
      const x = R() * w, y = R() * h, a = (-90 + (R() - 0.5) * 70) * Math.PI / 180, l = 16 + R() * 30;
      pasto += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x + Math.cos(a) * l).toFixed(0)}" y2="${(y + Math.sin(a) * l).toFixed(0)}" stroke="${verdes[Math.floor(R() * 4)]}"/>`;
    }
    const colores = ['#E8742B', '#B3282D', '#E9B93C', '#C9822F', '#7A2E3A', '#D9552B', '#F0C85A'];
    const tipos = ['maple', 'oval', 'roble', 'maple', 'oval'];
    const puestas = [];
    let hojas = '';
    const n = Math.round(w * h / 17000);
    for (let i = 0; i < n * 60 && puestas.length < n; i++) {
      const r = 34 + R() * 32;
      const x = w * 0.04 + R() * w * 0.92, y = h * 0.04 + R() * h * 0.92;
      if (puestas.some(p => Math.hypot(p.x - x, p.y - y) < (p.r + r) * 0.9)) continue;
      puestas.push({ x, y, r });
      const k = puestas.length;
      hojas += hoja(tipos[k % tipos.length], r, colores[Math.floor(R() * colores.length)], Math.round(R() * 360), x, y);
    }
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;left:0;top:0;display:block">
      <defs><linearGradient id="pasto${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6B30"/><stop offset="1" stop-color="#35502A"/></linearGradient></defs>
      <rect width="${w}" height="${h}" fill="url(#pasto${seed})"/>
      <g stroke-width="2" stroke-linecap="round" opacity="0.85">${pasto}</g>
      ${hojas}
    </svg>`;
  },

  // Sello postal con un corazón atravesado por una flecha (diseño propio)
  sello: (w, h) => {
    const rosa = '#F1C5CB', ladrillo = '#8E3B45';
    let perf = '';
    for (let i = 0; i <= 27; i++) {
      const x = 22 + i * (548 / 27);
      perf += `<circle cx="${x.toFixed(1)}" cy="22" r="6.5"/><circle cx="${x.toFixed(1)}" cy="448" r="6.5"/>`;
    }
    for (let i = 1; i < 21; i++) {
      const y = 22 + i * (426 / 21);
      perf += `<circle cx="22" cy="${y.toFixed(1)}" r="6.5"/><circle cx="570" cy="${y.toFixed(1)}" r="6.5"/>`;
    }
    const R = rng(21);
    let puntos = '';
    for (let i = 0; i < 40; i++) {
      const x = 62 + R() * 468, y = 62 + R() * 346;
      puntos += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.8 + R() * 1.6).toFixed(1)}"/>`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;left:0;top:0;display:block">
      <rect width="${w}" height="${h}" fill="${rosa}"/>
      <rect x="22" y="22" width="548" height="426" fill="#FFF8F5"/>
      <g fill="${rosa}">${perf}</g>
      <rect x="40" y="40" width="512" height="390" fill="none" stroke="#B2505B" stroke-width="2"/>
      <rect x="52" y="52" width="488" height="366" fill="#EBBFC5"/>
      <g fill="#FFFFFF" opacity="0.85">${puntos}</g>
      <g transform="translate(128 150)">${FORMAS.brillo(16, '#FFFFFF')}</g><g transform="translate(468 318)">${FORMAS.brillo(12, '#FFFFFF')}</g><g transform="translate(160 118) ">${FORMAS.brillo(8, '#FFFFFF')}</g>
      <text x="296" y="100" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="28" letter-spacing="7" fill="${ladrillo}">CORREO DEL AMOR</text>
      <line x1="150" y1="345" x2="445" y2="128" stroke="#5E2A30" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(296 238)">${FORMAS.corazon(112, '#B2505B')}</g>
      <polygon points="458,118 424,122 440,150" fill="#5E2A30" transform="rotate(8 445 128)"/>
      <g stroke="#5E2A30" stroke-width="7" stroke-linecap="round" fill="none"><path d="M150 345 L128 340 M150 345 L142 366"/><path d="M168 332 L146 327 M168 332 L160 353"/></g>
      <text x="84" y="398" font-family="Caveat, cursive" font-size="46" fill="${ladrillo}">con mucho amor</text>
      <text x="508" y="396" text-anchor="end" font-family="Nunito, sans-serif" font-weight="800" font-size="30" fill="${ladrillo}">14 · 02</text>
    </svg>`;
  },

  gatos: (w, h) => {
    const gato = (x, y, s, cuerpo, pecho, ojos) => `<g transform="translate(${x} ${y}) scale(${s})">
      <path d="M30 -8 C 78 -6 78 -64 56 -78" fill="none" stroke="${cuerpo}" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="0" cy="-48" rx="38" ry="50" fill="${cuerpo}"/>
      <ellipse cx="0" cy="-34" rx="20" ry="32" fill="${pecho}"/>
      <circle cx="0" cy="-112" r="30" fill="${cuerpo}"/>
      <polygon points="-28,-122 -26,-152 -6,-134" fill="${cuerpo}"/><polygon points="28,-122 26,-152 6,-134" fill="${cuerpo}"/>
      <polygon points="-24,-128 -23,-144 -13,-135" fill="#E9A9B0"/><polygon points="24,-128 23,-144 13,-135" fill="#E9A9B0"/>
      <ellipse cx="-11" cy="-114" rx="4" ry="6" fill="${ojos}"/><ellipse cx="11" cy="-114" rx="4" ry="6" fill="${ojos}"/>
      <path d="M-4 -103 h8 l-4 5 Z" fill="#E9A0A8"/>
      <g stroke="rgba(255,255,255,.7)" stroke-width="1.5" stroke-linecap="round"><line x1="-14" y1="-99" x2="-34" y2="-103"/><line x1="-14" y1="-95" x2="-34" y2="-93"/><line x1="14" y1="-99" x2="34" y2="-103"/><line x1="14" y1="-95" x2="34" y2="-93"/></g>
      <ellipse cx="-15" cy="-4" rx="13" ry="8" fill="${pecho}"/><ellipse cx="15" cy="-4" rx="13" ry="8" fill="${pecho}"/>
    </g>`;
    const R = rng(80);
    let lluvia = '';
    for (let i = 0; i < 110; i++) {
      const x = R() * (w + 40), y = R() * h;
      if (x > 120 && x < 470 && y > 140) continue; // zona seca bajo el paraguas
      lluvia += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x - 8).toFixed(0)}" y2="${(y + 26).toFixed(0)}"/>`;
    }
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;left:0;top:0;display:block">
      <defs>
        <linearGradient id="gatosCielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8DA5AE"/><stop offset="1" stop-color="#CBDADC"/></linearGradient>
        <radialGradient id="gatosLuz"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0.7"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="${w}" height="${h}" fill="url(#gatosCielo)"/>
      <path d="M0 330 Q 110 280 240 322 T 480 312 T 592 318 V410 H0 Z" fill="#7E9B94"/>
      <path d="M0 360 Q 160 330 330 358 T 592 348 V420 H0 Z" fill="#6C8B84"/>
      <path d="M0 392 Q 300 378 592 396 V470 H0 Z" fill="#55726D"/>
      <ellipse cx="300" cy="446" rx="200" ry="16" fill="#9DBBBE" opacity="0.55"/>
      <circle cx="520" cy="186" r="95" fill="url(#gatosLuz)"/>
      <line x1="520" y1="194" x2="520" y2="404" stroke="#33423F" stroke-width="9" stroke-linecap="round"/>
      <path d="M504 194 h32 l-7 -18 h-18 z" fill="#33423F"/><circle cx="520" cy="186" r="9" fill="#FFF2C4"/>
      <line x1="290" y1="270" x2="290" y2="430" stroke="#5B4636" stroke-width="7" stroke-linecap="round"/>
      ${gato(232, 434, 0.88, '#3F4A52', '#E7E1D6', '#F2D45C')}
      ${gato(352, 438, 0.8, '#E39B55', '#F6E3C6', '#5C7F3A')}
      <path d="M130 270 C130 195 200 150 290 150 C380 150 450 195 450 270 Q 410 246 370 270 Q 330 246 290 270 Q 250 246 210 270 Q 170 246 130 270 Z" fill="#E9B44C"/>
      <g stroke="rgba(0,0,0,.16)" stroke-width="2" fill="none"><path d="M290 150 L130 270"/><path d="M290 150 L210 270"/><path d="M290 150 L290 270"/><path d="M290 150 L370 270"/><path d="M290 150 L450 270"/></g>
      <circle cx="290" cy="146" r="6" fill="#5B4636"/>
      <g stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-linecap="round">${lluvia}</g>
      <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"><ellipse cx="90" cy="440" rx="26" ry="6"/><ellipse cx="90" cy="440" rx="14" ry="3"/><ellipse cx="510" cy="432" rx="30" ry="7"/><ellipse cx="510" cy="432" rx="16" ry="3.5"/></g>
      <g transform="translate(36 448) rotate(-30)">${FORMAS.hoja(24, '#7FA48A')}</g><g transform="translate(72 456) rotate(40)">${FORMAS.hoja(20, '#6F9478')}</g>
    </svg>`;
  }
};

// Un espacio para imagen: tu foto si existe en imagenes/MM/, si no una ilustración del tema
function espacioImagen(x, y, w, h, indice, seed, conFrase) {
  const img = D.imagenes[indice];
  const contenido = img
    ? `<img src="${img}" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block">`
    : (ESCENAS[conFrase ? T.escena : T.escenaAncha] ? ESCENAS[conFrase ? T.escena : T.escenaAncha](w, h, seed) : escena(w, h, seed));
  const posFrase = T.fraseArriba ? 'top:26px' : 'bottom:26px';
  const frase = conFrase && !(T.sinPastilla && !img)
    ? `<div class="script" style="position:absolute;left:28px;${posFrase};max-width:${w - 56}px;padding:8px 28px 16px;border-radius:32px;background:rgba(255,255,255,0.80);font-size:62px;color:${T.acento}">${T.frase}</div>`
    : '';
  return `<div class="tarjeta" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;overflow:hidden">${contenido}${frase}</div>`;
}

// ---------- Calendario ----------
const primerDia = (new Date(D.anio, D.mes - 1, 1).getDay() + 6) % 7; // lunes = 0
const totalDias = new Date(D.anio, D.mes, 0).getDate();
const feriados = new Set(((D.feriados || {})[String(D.mes)]) || []);

const especiales = [];
(T.especiales || []).forEach(e => {
  let dia = e.dia;
  if (e.nthDom) {
    let cuenta = 0;
    for (let d = 1; d <= totalDias; d++) {
      if (new Date(D.anio, D.mes - 1, d).getDay() === 0 && ++cuenta === e.nthDom) { dia = d; break; }
    }
  }
  if (dia) especiales.push({ dia, etiqueta: e.etiqueta });
});
if (D.cumpleanios && D.cumpleanios.mes === D.mes && D.cumpleanios.dia) {
  especiales.push({ dia: D.cumpleanios.dia, etiqueta: 'Mi cumpleaños' });
}
const diaEspecial = new Set(especiales.map(e => e.dia));

// Los meses que ocupan 6 filas usan celdas más chicas para que todo quepa en la tarjeta
const filas = Math.ceil((primerDia + totalDias) / 7);
const tam = filas > 5 ? 52 : 62;
const tamLetra = filas > 5 ? 27 : 30;
const espacioFilas = filas > 5 ? 6 : 8;

let celdas = '';
for (let i = 0; i < 7; i++) {
  const color = i >= 5 ? T.acento : T.panel;
  celdas += `<div class="celda" style="height:40px;font-size:24px;font-weight:800;color:${color}">${LETRAS[i]}</div>`;
}
for (let i = 0; i < primerDia; i++) celdas += `<div class="celda" style="width:${tam}px;height:${tam}px"></div>`;
for (let d = 1; d <= totalDias; d++) {
  const col = (primerDia + d - 1) % 7;
  const color = col >= 5 ? T.acento : T.texto;
  const fondo = feriados.has(d) ? `background:${T.feriado};` : '';
  const aro = diaEspecial.has(d) ? `box-shadow:inset 0 0 0 4px ${T.acento};` : '';
  celdas += `<div class="celda" style="width:${tam}px;height:${tam}px;font-size:${tamLetra}px;color:${color};${fondo}${aro}">${d}</div>`;
}

let leyenda = '';
if (feriados.size) {
  leyenda += `<div style="display:flex;align-items:center;gap:12px"><div style="width:22px;height:22px;border-radius:50%;background:${T.feriado}"></div>Feriados</div>`;
}
const etiquetas = [...new Set(especiales.map(e => e.etiqueta))];
etiquetas.forEach(et => {
  leyenda += `<div style="display:flex;align-items:center;gap:12px"><div style="width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:4px solid ${T.acento}"></div>${et}</div>`;
});

const iconoTitulo = (MOTIVOS[T.motivo] || MOTIVOS.primavera)[0];

// ---------- Armado de la página ----------
const html = `
<div style="position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(circle at 22% 95%, ${T.brillo2} 0, transparent 45%), radial-gradient(circle at 92% 8%, ${T.brillo1} 0, transparent 40%), ${T.fondo}">

  <div class="tarjeta" style="left:24px;top:24px;width:532px;height:976px;background:${T.panel};overflow:hidden">
    <div style="position:absolute;left:14px;top:14px;right:14px;bottom:14px;border-radius:26px;border:2px dashed rgba(255,255,255,0.38)"></div>
    <svg viewBox="0 0 300 260" width="300" height="260" style="position:absolute;right:0;bottom:0;display:block">${formasSueltas(300, 260, D.mes * 10 + 3, 7, 22, 46)}</svg>
    <div class="script" style="position:absolute;left:44px;bottom:34px;font-size:46px;color:${T.tarjeta}">mis apps</div>
  </div>

  <div class="tarjeta" style="left:580px;top:24px;width:700px;height:600px;padding:40px 44px;background:${T.tarjeta}">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:baseline;gap:18px">
        <div class="script" style="font-size:92px;color:${T.acento}">${MESES[D.mes - 1]}</div>
        <div style="font-size:34px;font-weight:800;color:${T.panel};letter-spacing:2px">${D.anio}</div>
      </div>
      <svg viewBox="-40 -40 80 80" width="76" height="76" style="display:block">${FORMAS[iconoTitulo](30, T.formas[0])}</svg>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));justify-items:center;row-gap:${espacioFilas}px;margin-top:22px">${celdas}</div>
    <div style="display:flex;align-items:center;gap:30px;margin-top:14px;font-size:20px;font-weight:700;color:${T.texto}">${leyenda}</div>
  </div>

  ${espacioImagen(580, 648, 700, 352, 1, D.mes * 10 + 2, false)}
  ${espacioImagen(1304, 24, 592, 470, 0, D.mes * 10 + 1, true)}

  <div class="tarjeta" style="left:1304px;top:518px;width:592px;height:482px;padding:36px 44px;background:${T.tarjeta}">
    <div style="position:absolute;left:236px;top:-12px;width:120px;height:30px;border-radius:6px;background:${T.feriado};opacity:0.9;transform:rotate(-3deg)"></div>
    <div class="script" style="font-size:58px;color:${T.acento}">notas</div>
    <div style="margin-top:14px;height:330px;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 54px, ${T.suave} 54px, ${T.suave} 56px)"></div>
  </div>
</div>`;

document.getElementById('raiz').innerHTML = html;

Promise.all([
  document.fonts.ready,
  ...[...document.images].map(i => i.decode().catch(() => {}))
]).then(() => { window.__LISTO__ = true; });
</script>
</body>
</html>
